<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
<title id="title">Jeff Fontenot homelab architecture</title>
<desc id="desc">A Lenovo laptop dual-booting Omarchy Linux as the daily driver and Windows, used rarely, connects over a private Tailscale mesh network to a Proxmox VE host on a Dell OptiPlex. The host runs four virtual machines: an Ubuntu Server running a Docker Compose stack with Traefik, Pi-hole and Unbound, Prometheus and Grafana, and Dashy; a sandbox Ubuntu Server; an Ubuntu Desktop; and a Fedora Desktop. It also runs two LXC containers, Jellyfin and Samba, and a three-node k3s cluster with one control plane and two workers.</desc>
<defs>
  <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#24aff5" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#24aff5" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff8c00"/>
    <stop offset="65%" stop-color="#ffd700"/>
    <stop offset="100%" stop-color="#f76d11"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#141a28"/>
    <stop offset="100%" stop-color="#0c101a"/>
  </linearGradient>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.5px; fill: #24aff5; }
    .h1 { font-size: 30px; font-weight: 800; fill: #f5f7fb; letter-spacing: -0.5px; }
    .subtitle { font-size: 15px; fill: #9aa7bd; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #24aff5; }
    .heading { font-size: 19px; font-weight: 700; fill: #f2f5fa; }
    .small { font-size: 14px; font-weight: 600; fill: #d7e0ee; }
    .body { font-size: 13.5px; fill: #aeb9cb; }
    .minor { font-size: 12.5px; fill: #8b96a9; }
    .chip { font-size: 13px; font-weight: 600; }
  </style>
</defs>

<rect width="1600" height="660" rx="28" fill="#08090d"/>
<circle cx="1420" cy="80" r="360" fill="url(#glowGold)"/>
<circle cx="80" cy="600" r="360" fill="url(#glowBlue)"/>

