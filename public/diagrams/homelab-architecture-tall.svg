<text class="heading" x="140" y="966" font-size="22">Ubuntu Desktop</text>
<text class="minor" x="112" y="1000">Debian-based practice</text>

<rect x="530" y="925" width="380" height="120" rx="16" fill="#121826" stroke="rgba(89,140,190,0.45)" stroke-width="1.5"/>
<circle cx="558" cy="957" r="9" fill="#53aef0"/>
<text class="heading" x="580" y="966" font-size="22">Fedora Desktop</text>
<text class="minor" x="552" y="1000">Red Hat-based practice</text>

