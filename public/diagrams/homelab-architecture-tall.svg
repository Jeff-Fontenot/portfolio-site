<g>
  <circle cx="192" cy="459" r="5.5" fill="#24aff5"/>
  <circle cx="176" cy="478" r="5.5" fill="#24aff5"/>
  <circle cx="210" cy="480" r="5.5" fill="#24aff5"/>
  <path d="M192 459 176 478M192 459 210 480M176 478 210 480" stroke="#24aff5" stroke-width="1.5" opacity="0.6"/>
</g>
<text class="label" x="240" y="464">TAILSCALE MESH NETWORK</text>
<text class="body" x="240" y="491">Secure remote access to every service by URL, from anywhere</text>

<!-- Connector to Proxmox -->
<path d="M500 512v38" stroke="rgba(255,255,255,0.28)" stroke-width="2.5" stroke-dasharray="6 7"/>
<path d="m489 547 11 11 11-11" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

