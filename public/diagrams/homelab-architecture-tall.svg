<rect x="86" y="252" width="60" height="60" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<rect x="98" y="266" width="36" height="24" rx="3" fill="none" stroke="#e7ecf5" stroke-width="2.5"/>
<path d="M92 296h48" stroke="#e7ecf5" stroke-width="2.5" stroke-linecap="round"/>
<text class="label" x="164" y="274">DAILY DRIVER</text>
<text class="heading" x="164" y="308">Lenovo Laptop &#8212; Dual Boot</text>

<rect x="164" y="325" width="330" height="44" rx="10" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.35)" stroke-width="1.5"/>
<circle cx="186" cy="347" r="5" fill="#34d399"/>
<text class="chip" x="202" y="352" fill="#f2f5fa">Omarchy (Arch Linux) &#8212; Daily Driver</text>

<rect x="506" y="325" width="330" height="44" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="528" cy="347" r="5" fill="#5b6472"/>
