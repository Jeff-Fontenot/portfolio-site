<rect x="60" y="580" width="880" height="869" rx="26" fill="#0b0f18" stroke="rgba(89,140,190,0.4)" stroke-width="1.5" filter="url(#shadow)"/>

<rect x="90" y="602" width="56" height="56" rx="12" fill="rgba(251,191,36,0.10)" stroke="rgba(251,191,36,0.4)" stroke-width="1.5"/>
<path d="M104 618h28M104 630h28M104 642h20" stroke="#ffcd45" stroke-width="2.5" stroke-linecap="round"/>
<text class="label" x="162" y="622">VIRTUALIZATION HOST</text>
<text class="heading" x="162" y="656">Proxmox VE</text>
<text class="body" x="910" y="648" text-anchor="end">Dell OptiPlex</text>

<line x1="90" y1="682" x2="910" y2="682" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

